apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghost-architect
  labels:
    app: ghost-architect
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ghost-architect
  template:
    metadata:
      labels:
        app: ghost-architect
    spec:
      securityContext:
        fsGroup: 1001
      containers:
        - name: ghost-architect
          image: registry.internal/ghost-architect:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: ghost-architect-config
            - secretRef:
                name: ghost-architect-secret
          volumeMounts:
            - name: uploads-storage
              mountPath: /app/public/uploads
              readOnly: false
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: uploads-storage
          persistentVolumeClaim:
            claimName: ghost-architect-uploads
