apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ghost-architect
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ghost-architect.internal
      secretName: ghost-architect-tls
  rules:
    - host: ghost-architect.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ghost-architect
                port:
                  number: 80
